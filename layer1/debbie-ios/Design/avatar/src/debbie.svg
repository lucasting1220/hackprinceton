    <path class="deep" d="M82.6 90.9 C82.6 88.3 84.4 86.7 86.6 86.7 C88.8 86.7 90.6 88.3 90.6 90.9 C90.6 93.1 88.8 94.3 86.6 94.3 C84.4 94.3 82.6 93.1 82.6 90.9 Z"/>
