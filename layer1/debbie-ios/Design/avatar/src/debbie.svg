    <path class="hair" d="M57.23 87.36 C56.37 70.08 58.74 53.88 69.76 42 C77.86 33.36 88.66 28.61 100.54 28.39 C128.08 27.96 145.58 47.4 143.85 74.4 C143.2 87.36 141.47 100.32 137.8 108.96 C135.8 113.4 133.7 116.5 131.6 117.8 C130.3 118.6 129.2 117.6 129.7 116.4 C132.3 110.6 133.91 102.6 133.91 93.84 C133.91 83.04 131.32 72.78 124.3 66.3 C121.06 63.6 117.82 61.98 114.04 61.44 C101.08 59.82 87.04 54.96 80.56 45.78 C69.76 56.04 64.79 70.08 65.33 85.85 C64.0 87.2 60.4 87.3 57.63 89.8 C57.3 89.0 57.15 88.2 57.23 87.36 Z"/>
