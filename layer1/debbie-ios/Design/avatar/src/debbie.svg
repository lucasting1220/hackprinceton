    <path class="skin" d="M100 44.16 C121.06 44.16 137.15 60.36 137.37 85.2 C137.58 106.5 131.6 124.3 114.69 132.94 C111.2 135.0 106.6 136.4 101.51 136.4 C96.3 136.4 91.6 135.2 88.12 133.37 C70.4 124.4 62.63 106.5 62.63 85.2 C62.63 60.36 78.94 44.16 100 44.16 Z"/>
