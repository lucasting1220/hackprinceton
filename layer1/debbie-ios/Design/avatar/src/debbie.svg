<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!--
    Debbie, the assistant's face. Layered source for every avatar the app draws: 30 pt
    (centre tab), 44 pt (chat), 64 pt (onboarding guide), 111 pt (badge view) and 148 pt
    (welcome hero), per Tokens.swift. Export: Design/scripts/export-avatar.sh (one PDF
    imageset per layer, review sheet in Design/reviews/avatar/debbie.png).

    Canvas: 200 x 200, transparent. Every layer is one <g id> on this same canvas, so the
    exported layers stack in perfect alignment. Composite order, bottom to top:
      body, hair-back, head, cheeks, eyes-open | eyes-closed, brows, mouth, hair-front
    eyes-closed is the blink frame: hidden here (display="none") so this file previews the
    rest pose; the export script shows it in its own layer. Its lids sit on the lower lash
    line, where a real blink closes.

    NECK PIVOT (head tilt centre): (100, 150), the neck centre; UnitPoint(x: 0.5, y: 0.75)
    in SwiftUI. Every layer except body tilts around it. body stays still. The circle crop
    is the inscribed circle (centre 100,100, r 100): body's lower edge follows that arc, and
    the head layers keep their distance from it so a +/-3 degree tilt never clips, and at
    rest they stay inside the 30 pt tab's selected ring (the export script measures both).

    Style: flat vector, rounded geometric shapes with round ends, no outlines, no gradients,
    no text, logos or jewellery. The eyes are plain dark rounds with no white: the owner saw
    white catch-lights as white pupils (17:24), so there are none. The hair is
    one flat tone; 'deep' fills behind the head, shows only as the small shadow under the
    fringe's sweep, and never forms the outer silhouette (the export script checks this).

    Palette (edit it here, in one place):
      mint    #6CDCB0  top (brand mint.fill)
      collar  #0A6B4D  crew neckline (brand accent.text)
      skin    #C28468  face, ears, neck: warm medium tone
      shade   #A76A50  neck shadow, inner ear, nose, lid creases
      cheek   #C9806E  cheek warmth (luminance-matched to skin, so it stays subtle)
      hair    #573A2D  crown, fringe, bun, brows: soft dark brown
      deep    #38231B  back hair, eyes (round, no white), closed lids
      lip     #492E28  closed-mouth smile: a warm dark brown that still reads at 30 pt
    Appearance colours, named <class>-<appearance>, apply only to the groups that list that
    appearance in data-appearances: the export writes those layers a rendition per
    appearance. The circle behind her is mint.tint, which darkens in Dark (#123026) and
    again in Dark + Increase Contrast (#1C4536), where the light hair would sink into it.
      hair-dark    #6E4A39  deep-dark    #4E3328   hair on #123026: 1.83:1
      hair-darkHC  #7E5644  deep-darkHC  #5A3D30   hair on #1C4536: 1.69:1
    Light + Increase Contrast keeps the light colours. The brows keep the light hair colour
    in every appearance: they sit on skin. (deep-darkHC is 0.8 CIEDE2000 from the review's
    #5C3D30, which sat 16.9 from urgent.fill.pressed in Dark + Increase Contrast.)
    The non-brand colours are each at least CIEDE2000 17 from every urgent, caution and live
    fill (pressed included) in every appearance they show in: all four for the base colours,
    their own for the appearance colours. So nothing in the face reads as a status colour
    (CRAFT.md C5). The export script re-measures this, and the hair against mint.tint, on
    every run.
  -->
  <style>
    .mint{fill:#6CDCB0}.collar{fill:#0A6B4D}.skin{fill:#C28468}.shade{fill:#A76A50}
    .cheek{fill:#C9806E}.hair{fill:#573A2D}.deep{fill:#38231B}
    .lip{fill:#492E28}
    .hair-dark{fill:#6E4A39}.deep-dark{fill:#4E3328}
    .hair-darkHC{fill:#7E5644}.deep-darkHC{fill:#5A3D30}
  </style>
  <g id="body">
