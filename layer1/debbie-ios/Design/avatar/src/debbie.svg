    <path class="shade" d="M106.7 97.08 C109.29 100.54 110.37 103.99 108.64 105.94 C107.13 107.45 104.32 107.45 101.73 106.58 C104.54 106.37 106.48 105.72 106.91 104.42 C107.45 102.48 107.34 99.89 106.7 97.08 Z"/>
  </g>
  <g id="cheeks">
    <ellipse class="cheek" cx="80.6" cy="102.6" rx="6.6" ry="4.1"/>
    <ellipse class="cheek" cx="125.4" cy="102.6" rx="5.6" ry="3.8"/>
  </g>
