<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debbie: this home's laptops</title>
<style>
:root { --bg: #1c1c1e; --side: #262628; --panel: #2c2c2e; --raise: #3a3a3c; --track: #3a3a3c;
  --dim: #48484a; --text: #f2f2f7; --muted: #98989f; --blue: #0a84ff; --pink: #ff375f;
  --orange: #ff9f0a; --green: #30d158; --red: #ff453a; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; background: #000; color: var(--text);
  font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
nav { width: 260px; flex: none; background: var(--side); border-right: 1px solid #000; padding: 1.2rem 0;
  display: flex; flex-direction: column; }
nav .brand { padding: 0 1.4rem 1rem; font-weight: 700; font-size: 1.15rem; letter-spacing: .02em; }
nav .group { padding: 1rem 1.4rem .35rem; color: var(--muted); font-size: .8rem; font-weight: 600; }
nav a { display: flex; align-items: center; gap: .75rem; padding: .7rem 1.4rem; color: var(--text);
  text-decoration: none; font-size: 1.05rem; }
nav a.on { background: var(--raise); }
nav a svg { width: 22px; height: 22px; flex: none; color: var(--muted); }
nav a.on svg { color: var(--text); }
nav a .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); margin-left: auto; flex: none; }
nav a .dot.off { background: var(--red); }
nav .grow { flex: 1; }
nav .updated { padding: 0 1.4rem; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
main { flex: 1; background: var(--bg); overflow-y: auto; padding: 2.2rem 2.6rem; }
#error { color: var(--red); font-weight: 600; min-height: 1.3em; margin: 0 0 .6rem; }
.hero { display: flex; gap: 2.2rem; align-items: center; margin-bottom: 2rem; }
.hero svg.machine { width: 190px; flex: none; }
.hero h1 { margin: 0; font-size: 2.1rem; }
.hero .sub { color: var(--muted); font-size: 1.15rem; margin: .2rem 0 1rem; }
.facts { display: grid; grid-template-columns: 1fr 1fr; column-gap: 2rem; }
.facts dl { margin: 0; display: grid; grid-template-columns: auto 1fr; row-gap: .3rem; column-gap: 1.2rem; }
.facts dl + dl { border-left: 1px solid var(--dim); padding-left: 2rem; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 1.4rem; }
.panel { background: var(--panel); border-radius: 14px; padding: 1.4rem 1.6rem; }
.panel.link { cursor: pointer; }
.panel.link:hover { background: #333336; }
.panel.quiet { box-shadow: inset 0 0 0 2px var(--red); }
.panel h2 { margin: 0 0 1.1rem; font-size: 1.25rem; display: flex; align-items: center; gap: .6rem; }
.panel h2 .tag { margin-left: auto; font-size: .78rem; font-weight: 600; color: var(--green); }
.panel.quiet h2 .tag { color: var(--red); }
.split { display: flex; gap: 1.6rem; align-items: center; }
.split > .side { flex: 1; min-width: 0; }
.ring { width: 150px; height: 150px; flex: none; position: relative; }
.ring.small { width: 112px; height: 112px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .label b { font-size: 1.9rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.ring.small .label b { font-size: 1.45rem; }
.ring .label span { color: var(--muted); font-size: .9rem; }
.meter { margin-bottom: .9rem; }
.meter .name { color: var(--muted); font-size: .9rem; }
.meter .bar { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; margin: .3rem 0 .2rem; }
.meter .bar i { display: block; height: 100%; border-radius: 5px; background: var(--blue); transition: width .5s; }
.meter .value { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.legend { display: grid; grid-template-columns: auto 1fr auto; gap: .35rem .6rem; align-items: center; }
.legend i { width: 15px; height: 15px; border-radius: 4px; }
.legend .n { text-align: right; font-variant-numeric: tabular-nums; }
.rows { border-top: 1px solid var(--dim); margin-top: 1.1rem; padding-top: .8rem; }
.row { display: flex; align-items: center; gap: .7rem; padding: .3rem 0; }
.row .st { margin-left: auto; font-size: .9rem; font-weight: 600; }
.st.running { color: var(--green); } .st.starting { color: var(--muted); } .st.restarting { color: var(--orange); }
.chip { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.banner { display: flex; align-items: center; gap: 1.2rem; margin-bottom: 1.4rem; padding: 1rem 1.4rem; }
.badge { font-weight: 700; font-size: .85rem; letter-spacing: .06em; padding: .45rem .8rem; border-radius: 8px; flex: none; }
.badge.ai { background: rgba(10,132,255,.18); color: var(--blue); }
.badge.rules { background: var(--raise); color: var(--muted); }
.row .small { margin-left: .4rem; }
.warn { color: var(--orange); }
svg.dots { width: 100%; height: 64px; display: block; margin: .3rem 0 .2rem; }
.pair { display: flex; gap: 1.2rem; }
@media (max-width: 760px) {
  body { flex-direction: column; font-size: 16px; }
  nav { width: auto; flex-direction: row; flex-wrap: wrap; padding: .5rem; }
  nav .brand, nav .group, nav .grow, nav .updated { display: none; }
  nav a { padding: .5rem .8rem; border-radius: 8px; }
  #nav-laptops { display: contents; }
  main { padding: 1.2rem; }
  .hero { flex-direction: column; align-items: flex-start; }
  .facts { grid-template-columns: 1fr; }
  .facts dl + dl { border-left: 0; padding-left: 0; margin-top: .3rem; }
  .grid { grid-template-columns: 1fr; }
  .split { flex-direction: column; align-items: stretch; }
  .ring { margin: 0 auto; }
}
</style>
</head>
<body>
<nav>
  <div class="brand">Debbie</div>
  <div class="group">Home</div>
  <a href="#overview" id="nav-overview">Overview</a>
  <div class="group">Laptops</div>
  <div id="nav-laptops"></div>
  <div class="grow"></div>
  <div class="updated" id="updated"></div>
</nav>
<main>
  <p id="error"></p>
  <div id="view"></div>
</main>
<script>
const STALE_AFTER_MS = __STALE_AFTER_MS__;
const POLL_MS = __POLL_MS__;
const HISTORY_POINTS = __HISTORY_POINTS__;
const SVG = "http://www.w3.org/2000/svg";
const cpuHistory = new Map();  // node_id -> [0..1], newest last
let latest = null;
let restarts = new Map();  // "node_id job" -> restarts, from /api/details
let decision = null;  // the latest re-plan, from /api/details
const CRASHING_AFTER = 3;  // restarts before a job is shown as crashing

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
function svg(tag, attrs) {
  const node = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  return node;
}
async function getJson(url) {
  const r = await fetch(url, { cache: "no-store", signal: AbortSignal.timeout(POLL_MS * 2) });
  if (!r.ok) throw new Error(url + " answered " + r.status);
  return r.json();
}
const clamp = (x) => Math.max(0, Math.min(1, x));
const loadColor = (f) => (f < 0.6 ? "var(--blue)" : f < 0.85 ? "var(--orange)" : "var(--pink)");

// A ring of coloured segments [{fraction, color}] around a centre label.
function ring(segments, big, small, size) {
  const box = el("div", "ring" + (size === "small" ? " small" : ""));
  const g = svg("svg", { viewBox: "0 0 120 120" });
  const r = 50, c = 2 * Math.PI * r;
  g.appendChild(svg("circle", { cx: 60, cy: 60, r, fill: "none", stroke: "var(--track)", "stroke-width": 11 }));
  let offset = 0;
  for (const s of segments) {
    const len = clamp(s.fraction) * c;
    if (len <= 0) continue;
    g.appendChild(svg("circle", { cx: 60, cy: 60, r, fill: "none", stroke: s.color, "stroke-width": 11,
      "stroke-dasharray": len + " " + (c - len), "stroke-dashoffset": -offset }));
    offset += len;
  }
  box.appendChild(g);
  const label = el("div", "label");
  label.appendChild(el("b", "", big));
  label.appendChild(el("span", "", small));
  box.appendChild(label);
  return box;
}

// Load history as a dot matrix: one column per second, lit dots up to the load.
function dots(history) {
  const cols = 60, rows = 8, w = 5, h = 7;
  const g = svg("svg", { viewBox: "0 0 " + cols * w + " " + rows * h, preserveAspectRatio: "none", class: "dots",
    role: "img", "aria-label": "Processor load over the last minute" });
  const recent = history.slice(-cols);
  for (let x = 0; x < cols; x++) {
    const value = recent[x - (cols - recent.length)];
    const lit = value === undefined ? 0 : Math.max(value > 0.01 ? 1 : 0, Math.round(value * rows));
    for (let y = 0; y < rows; y++) {
      g.appendChild(svg("rect", { x: x * w + 1, y: (rows - 1 - y) * h + 1, width: w - 2, height: h - 2, rx: 1,
        fill: y < lit ? "var(--blue)" : "var(--dim)" }));
    }
  }
  return g;
}

// Small sidebar icons, drawn in the text colour.
function icon(kind) {
  const g = svg("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": 1.8,
    "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" });
  if (kind === "home") {
    for (const [x, y] of [[3, 3], [13, 3], [3, 13], [13, 13]]) g.appendChild(svg("rect", { x, y, width: 8, height: 8, rx: 2 }));
  } else {
    g.appendChild(svg("rect", { x: 4, y: 5, width: 16, height: 11, rx: 1.5 }));
    g.appendChild(svg("path", { d: "M2 19 H22" }));
  }
  return g;
}

function machine() {
  const g = svg("svg", { viewBox: "0 0 200 130", class: "machine", "aria-hidden": "true" });
  const defs = svg("defs");
  const grad = svg("linearGradient", { id: "metal", x1: 0, y1: 0, x2: 0, y2: 1 });
  grad.appendChild(svg("stop", { offset: "0", "stop-color": "#8e8e93" }));
  grad.appendChild(svg("stop", { offset: "1", "stop-color": "#48484a" }));
  defs.appendChild(grad);
  g.appendChild(defs);
  g.appendChild(svg("rect", { x: 30, y: 8, width: 140, height: 92, rx: 7, fill: "url(#metal)" }));
  g.appendChild(svg("rect", { x: 37, y: 15, width: 126, height: 78, rx: 3, fill: "#0b1a2e" }));
  g.appendChild(svg("path", { d: "M8 104 H192 L184 118 Q182 121 177 121 H23 Q18 121 16 118 Z", fill: "url(#metal)" }));
  g.appendChild(svg("rect", { x: 86, y: 104, width: 28, height: 4, rx: 2, fill: "#3a3a3c" }));
  return g;
}

function facts(left, right) {
  const box = el("div", "facts");
  for (const pairs of [left, right]) {
    const dl = el("dl");
    for (const [k, v] of pairs) { dl.appendChild(el("dt", "", k)); dl.appendChild(el("dd", "", v)); }
    box.appendChild(dl);
  }
  return box;
}

function hero(title, sub, factsBox) {
  const box = el("div", "hero");
  box.appendChild(machine());
  const text = el("div");
  text.style.flex = "1";
  text.appendChild(el("h1", "", title));
  text.appendChild(el("div", "sub", sub));
  text.appendChild(factsBox);
  box.appendChild(text);
  return box;
}

function describe(hw) {
  const s = hw.specs;
  return {
    os: (s.os === "macos" ? "macOS " : "Windows ") + s.os_version,
    gpu: s.gpu === "none" ? "None" : s.gpu === "apple-silicon" ? "Apple silicon" : "NVIDIA",
  };
}

function usage(hw, quiet) {
  if (!hw || quiet || hw.memory_free_gb === null || hw.cpu_percent === null) return null;
  const total = hw.specs.memory_gb;
  const used = Math.max(0, total - hw.memory_free_gb);
  return { total, used, free: Math.min(total, hw.memory_free_gb), ram: total ? used / total : 0, cpu: hw.cpu_percent / 100 };
}

function jobRows(jobs) {
  const box = el("div", "rows");
  if (jobs.length === 0) box.appendChild(el("div", "row muted", "No jobs on this laptop"));
  for (const job of jobs) {
    const row = el("div", "row");
    const chip = el("span", "chip");
    chip.style.background = job.state === "running" ? "var(--green)" : job.state === "restarting" ? "var(--orange)" : "var(--dim)";
    row.appendChild(chip);
    row.appendChild(el("span", "", job.job));
    const count = restarts.get(job.node_id + " " + job.job) || 0;
    if (count > 0) {
      const note = count >= CRASHING_AFTER ? "keeps crashing · " + count + " restarts" : "restarted " + count + "×";
      row.appendChild(el("span", count >= CRASHING_AFTER ? "warn small" : "muted small", note));
    }
    row.appendChild(el("span", "st " + job.state, job.state));
    box.appendChild(row);
  }
  return box;
}

// Who made the current plan and why: the AI planner, or the rules it falls back to.
function plannerBanner() {
  const box = el("div", "panel banner");
  const ai = decision && decision.made_by === "ai";
  const badge = el("span", ai ? "badge ai" : "badge rules", ai ? "AI" : "RULES");
  const text = el("div", "side");
  if (!decision) {
    text.appendChild(el("div", "", "No plan yet"));
    text.appendChild(el("div", "muted", "The planner runs when a laptop joins."));
  } else {
    const when = new Date(decision.decided_at).toLocaleTimeString();
    text.appendChild(el("div", "", (ai ? "Jobs placed by the AI planner" : "Jobs placed by the rules") + " · " + when));
    text.appendChild(el("div", "muted", decision.why));
    if (decision.moved.length > 0) text.appendChild(el("div", "warn small", "Moved: " + decision.moved.join(", ")));
  }
  box.appendChild(badge);
  box.appendChild(text);
  return box;
}

function laptopSummary(laptop, hw, jobs, now) {
  const quiet = now - Date.parse(laptop.last_status_at) > STALE_AFTER_MS;
  const panel = el("div", "panel link" + (quiet ? " quiet" : ""));
  panel.addEventListener("click", () => { location.hash = "#" + encodeURIComponent(laptop.node_id); });
  const h = el("h2", "", laptop.display_name);
  h.appendChild(el("span", "tag", quiet ? "NOT REPORTING" : "ONLINE"));
  panel.appendChild(h);
  const u = usage(hw, quiet);
  const pair = el("div", "pair");
  if (u) {
    pair.appendChild(ring([{ fraction: u.ram, color: "var(--blue)" }], Math.round(u.ram * 100) + "%", "memory", "small"));
    pair.appendChild(ring([{ fraction: u.cpu, color: loadColor(u.cpu) }], Math.round(u.cpu * 100) + "%", "processor", "small"));
    const side = el("div", "side");
    side.appendChild(el("div", "muted", hw ? describe(hw).os : ""));
    side.appendChild(el("div", "", u.used.toFixed(1) + " of " + u.total + " GB in use"));
    side.appendChild(el("div", "muted", hw.specs.cores + " cores"));
    side.style.alignSelf = "center";
    pair.appendChild(side);
  } else {
    pair.appendChild(el("div", "muted", quiet ? "Last report " + Math.round((now - Date.parse(laptop.last_status_at)) / 1000) + " s ago" : "Waiting for the first report"));
  }
  panel.appendChild(pair);
  panel.appendChild(jobRows(jobs));
  return panel;
}

function overview(state, hwById, now) {
  const view = el("div");
  let online = 0, pooled = 0, used = 0;
  for (const laptop of state.laptops) {
    const quiet = now - Date.parse(laptop.last_status_at) > STALE_AFTER_MS;
    if (!quiet) online += 1;
    const u = usage(hwById.get(laptop.node_id), quiet);
    if (u) { pooled += u.total; used += u.used; }
  }
  const running = state.jobs.filter((j) => j.state === "running").length;
  view.appendChild(hero("This home", state.laptops.length + (state.laptops.length === 1 ? " laptop" : " laptops") + " working as one",
    facts([["Laptops online", online + " of " + state.laptops.length], ["Memory pooled", pooled + " GB"], ["Memory in use", used.toFixed(1) + " GB"]],
          [["Jobs running", String(running)], ["Jobs placed", String(state.jobs.length)],
           ["Job restarts", String([...restarts.values()].reduce((a, b) => a + b, 0))],
           ["Work not placed", String(state.dropped.length)]])));
  view.appendChild(plannerBanner());
  const grid = el("div", "grid");
  for (const laptop of state.laptops) {
    grid.appendChild(laptopSummary(laptop, hwById.get(laptop.node_id), state.jobs.filter((j) => j.node_id === laptop.node_id), now));
  }
  if (state.laptops.length === 0) grid.appendChild(el("div", "panel muted", "No laptops have joined yet."));
  const dropped = el("div", "panel");
  dropped.appendChild(el("h2", "", "Work not placed"));
  if (state.dropped.length === 0) dropped.appendChild(el("div", "muted", "Everything is placed."));
  for (const item of state.dropped) {
    const row = el("div", "row");
    const chip = el("span", "chip");
    chip.style.background = "var(--orange)";
    row.appendChild(chip);
    const text = el("div");
    text.appendChild(el("div", "", item.work));
    text.appendChild(el("div", "muted", item.reason));
    row.appendChild(text);
    dropped.appendChild(row);
  }
  grid.appendChild(dropped);
  view.appendChild(grid);
  return view;
}

function laptopView(laptop, hw, jobs, now) {
  const view = el("div");
  const quiet = now - Date.parse(laptop.last_status_at) > STALE_AFTER_MS;
  const d = hw ? describe(hw) : { os: "Unknown", gpu: "Unknown" };
  const s = hw ? hw.specs : null;
  const has = (kind) => (laptop.sensors.includes(kind) ? "Attached" : "None");
  view.appendChild(hero(laptop.display_name, d.os + (quiet ? " · not reporting" : " · online"),
    facts([["Processor", s ? s.cpu : "Unknown"], ["Cores", s ? String(s.cores) : "Unknown"], ["Graphics", d.gpu], ["Memory", s ? s.memory_gb + " GB" : "Unknown"]],
          [["Camera", has("camera")], ["Microphone", has("mic")], ["Ollama", hw ? (hw.tools.ollama ? "Ready" : "Not found") : "Unknown"], ["Python", hw ? hw.tools.python : "Unknown"]])));
  const grid = el("div", "grid");
  const u = usage(hw, quiet);
  const mem = el("div", "panel");
  mem.appendChild(el("h2", "", "Memory"));
  const cpu = el("div", "panel");
  cpu.appendChild(el("h2", "", "Processor"));
  if (u) {
    const split = el("div", "split");
    split.appendChild(ring([{ fraction: u.ram, color: "var(--blue)" }], Math.round(u.ram * 100) + "%", "memory"));
    const side = el("div", "side");
    const legend = el("div", "legend");
    for (const [name, color, gb] of [["In use", "var(--blue)", u.used], ["Available", "var(--track)", u.free]]) {
      const swatch = el("i"); swatch.style.background = color;
      legend.appendChild(swatch); legend.appendChild(el("span", "", name)); legend.appendChild(el("span", "n", gb.toFixed(2) + " GB"));
    }
    side.appendChild(legend);
    side.appendChild(el("div", "muted", "of " + u.total + " GB"));
    split.appendChild(side);
    mem.appendChild(split);
    const split2 = el("div", "split");
    split2.appendChild(ring([{ fraction: u.cpu, color: loadColor(u.cpu) }], Math.round(u.cpu * 100) + "%", "processor"));
    const side2 = el("div", "side");
    const m = el("div", "meter");
    m.appendChild(el("div", "name", "Load, last minute"));
    m.appendChild(dots(cpuHistory.get(laptop.node_id) || []));
    m.appendChild(el("div", "value", Math.round(u.cpu * 100) + "%"));
    side2.appendChild(m);
    side2.appendChild(el("div", "muted", s.cores + " cores · " + s.cpu));
    split2.appendChild(side2);
    cpu.appendChild(split2);
  } else {
    const wait = quiet ? "Last report " + Math.round((now - Date.parse(laptop.last_status_at)) / 1000) + " s ago" : "Waiting for the first report";
    mem.appendChild(el("div", "muted", wait));
    cpu.appendChild(el("div", "muted", wait));
  }
  const jobsPanel = el("div", "panel");
  jobsPanel.appendChild(el("h2", "", "Jobs"));
  const rows = jobRows(jobs);
  rows.style.borderTop = "0"; rows.style.marginTop = "0"; rows.style.paddingTop = "0";
  jobsPanel.appendChild(rows);
  const setup = el("div", "panel");
  setup.appendChild(el("h2", "", "Setup"));
  if (laptop.missing.length === 0) setup.appendChild(el("div", "muted", "Nothing missing."));
  for (const item of laptop.missing) {
    const row = el("div", "row");
    row.appendChild(el("span", item.required ? "warn" : "muted", item.id));
    row.appendChild(el("span", "st " + (item.required ? "restarting" : "starting"), item.required ? "required" : "optional"));
    setup.appendChild(row);
  }
  for (const p of [mem, cpu, jobsPanel, setup]) grid.appendChild(p);
  view.appendChild(grid);
  return view;
}

function render() {
  if (!latest) return;
  const { state, hwById } = latest;
  const now = Date.parse(state.updated_at);
  const nav = document.getElementById("nav-laptops");
  nav.replaceChildren();
  const selected = decodeURIComponent(location.hash.slice(1)) || "overview";
  const chosen = state.laptops.find((l) => l.node_id === selected);
  document.getElementById("nav-overview").className = chosen ? "" : "on";
  const home = document.getElementById("nav-overview");
  if (!home.querySelector("svg")) home.prepend(icon("home"));
  for (const laptop of state.laptops) {
    const a = el("a", laptop === chosen ? "on" : "");
    a.href = "#" + encodeURIComponent(laptop.node_id);
    a.appendChild(icon("laptop"));
    a.appendChild(el("span", "", laptop.display_name));
    a.appendChild(el("span", now - Date.parse(laptop.last_status_at) > STALE_AFTER_MS ? "dot off" : "dot"));
    nav.appendChild(a);
  }
  const view = document.getElementById("view");
  view.replaceChildren(chosen
    ? laptopView(chosen, hwById.get(chosen.node_id), state.jobs.filter((j) => j.node_id === chosen.node_id), now)
    : overview(state, hwById, now));
  document.getElementById("updated").textContent = "Updated " + new Date(now).toLocaleTimeString();
}

// The coordinator is unreachable: nothing shown can be trusted to be current.
function markAllUnknown(message) {
  document.getElementById("error").textContent = message;
  for (const dot of document.querySelectorAll("nav .dot")) dot.className = "dot off";
  for (const panel of document.querySelectorAll(".panel.link")) {
    panel.classList.add("quiet");
    const tag = panel.querySelector(".tag");
    if (tag) tag.textContent = "UNKNOWN";
  }
}

async function refresh() {
  let state;
  try {
    state = await getJson("/api/state");
  } catch (problem) {
    markAllUnknown("Cannot reach the coordinator. Laptop status is unknown.");
    return;
  }
  let hwById = new Map();
  let note = "";
  try {
    const hardware = await getJson("/api/hardware");
    hwById = new Map(hardware.laptops.map((h) => [h.node_id, h]));
  } catch (problem) {
    note = "Hardware details are unavailable right now.";
  }
  try {
    const details = await getJson("/api/details");
    restarts = new Map(details.jobs.map((j) => [j.node_id + " " + j.job, j.restarts]));
    decision = details.planner || null;
  } catch (problem) {
    restarts = new Map();  // the page still works without the extra details
    decision = null;
  }
  for (const hw of hwById.values()) {
    if (hw.cpu_percent === null) continue;
    const points = cpuHistory.get(hw.node_id) || [];
    points.push(hw.cpu_percent / 100);
    while (points.length > HISTORY_POINTS) points.shift();
    cpuHistory.set(hw.node_id, points);
  }
  latest = { state, hwById };
  document.getElementById("error").textContent = note;
  render();
}

window.addEventListener("hashchange", render);
async function loop() { await refresh(); setTimeout(loop, POLL_MS); }
loop();
</script>
</body>
