[project]
name = "layer2"
version = "0.1.0"
description = "Debbie Layer 2: the coordinator and worker programs"
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.11",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff==0.17.5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layer2"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
