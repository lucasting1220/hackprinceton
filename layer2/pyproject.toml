[project]
name = "layer2"
version = "0.1.0"
description = "Debbie Layer 2: the coordinator and worker programs"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "psutil>=7.0",
    "pydantic>=2.11",
    "uvicorn>=0.32",
    "websockets>=14",
]

[project.scripts]
layer2-coordinator = "layer2.coordinator.main:run"
layer2-worker = "layer2.worker.main:run"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff==0.17.5",
    "types-psutil>=7.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layer2"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Starlette 1.10's TestClient asks for the httpx2 package; httpx still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
