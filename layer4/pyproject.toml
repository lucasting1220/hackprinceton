[project]
name = "layer4"
version = "0.1.0"
description = "Debbie Layer 4: the care layer"
requires-python = "==3.12.*"
dependencies = [
    "layer2",
    "mediapipe==1.2.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy>=2.0,<3",
]

[tool.uv.sources]
layer2 = { path = "../layer2", editable = true }

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.2",
    "ruff==0.17.5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layer4"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/typings"
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
