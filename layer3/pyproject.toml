[project]
name = "layer3"
version = "0.1.0"
description = "Debbie Layer 3: raw data. Camera and mic capture, and receiving watch data."
requires-python = "==3.12.*"
dependencies = [
    "cv2-enumerate-cameras>=1.4,<2",
    "layer2",
    "numpy>=2.0,<3",
    "opencv-python-headless>=5.0,<6",
    "pyobjc-framework-AVFoundation>=13,<14; sys_platform == 'darwin'",
    "sounddevice>=0.5,<0.6",
    "websockets>=14",
]

[tool.uv.sources]
layer2 = { path = "../layer2", editable = true }

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layer3"]

[tool.mypy]
python_version = "3.12"
mypy_path = "$MYPY_CONFIG_FILE_DIR/typings"
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
